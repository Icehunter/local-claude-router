name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Both versions run even when one fails: a failure on 22 only is the
      # whole point of testing the floor separately from the newest release.
      fail-fast: false
      matrix:
        # The supported LTS lines, matching engines ">=22". 22 is the declared
        # floor (EOL 2027-04-30), 24 is current LTS (EOL 2028-04-30). Odd
        # Current releases are deliberately absent: they leave support before
        # an LTS does, so a green run on one proves nothing about what this
        # package claims to support.
        node: ['22', '24']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # typecheck covers src and tests; build covers src alone and is what
      # ships, so a failure in either is worth blocking on.
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
